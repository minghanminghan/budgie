name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  # Release, then deploy on the mini PC: github.com/minghanminghan/hawk
  hawk:
    needs: test
    uses: minghanminghan/hawk/.github/workflows/release.yml@main
    permissions:
      contents: write
    with:
      app: budgie
