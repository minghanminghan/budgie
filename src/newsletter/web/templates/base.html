<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}Reading list{% endblock %}</title>
<style>
  :root {
    --paper: #EEF2F5; --ink: #1C2733; --muted: #5B6B7A; --rule: #D3DCE3;
    --pine: #2F6F5E; --brick: #9A4A3C; --focus: #3B7BBF;
    --serif: Charter, "Bitstream Charter", "Iowan Old Style", "Sitka Text", Cambria, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.5 var(--sans); }
  main { max-width: 38rem; margin: 0 auto; padding: 1.25rem 1.1rem 4rem; }
  nav { display: flex; gap: 1.1rem; font-size: .9rem; margin-bottom: 2rem; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover, nav a[aria-current="page"] { color: var(--ink); }
  nav form { margin-left: auto; }
  nav .push { margin-left: auto; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h1 { font: 600 2.4rem/1.1 var(--serif); letter-spacing: -.01em; margin: 0 0 .3rem; }
  .lede { color: var(--muted); margin: 0 0 2rem; }
  .empty { font: 1.15rem/1.6 var(--serif); color: var(--muted); }
  button, input { font: inherit; }
  .link-button { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-size: .9rem; }
  .link-button:hover { color: var(--ink); }
  /* Laptops: scale every rem up, so type and column grow together. */
  @media (min-width: 64rem) {
    html { font-size: 18px; }
    main { padding-top: 3rem; }
    nav { margin-bottom: 3rem; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<main>
<nav>
  <a href="/">Today</a>
  <a href="/archive">Archive</a>
  <a href="/sources">Sources</a>
  {% if owner %}
  <form method="post" action="/logout" class="push"><button class="link-button">Log out</button></form>
  {% else %}
  <a href="/login" class="push">Log in</a>
  {% endif %}
</nav>
{% block content %}{% endblock %}
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
