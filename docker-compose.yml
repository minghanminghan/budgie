x-app: &app
  build: .
  image: newsletter:latest
  env_file: .env
  environment:
    TZ: America/New_York
  volumes:
    - data:/data
  restart: unless-stopped

services:
  web:
    <<: *app
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn newsletter.web.app:create_app --factory --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    <<: *app
    command: python -m newsletter.worker
    depends_on:
      web:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:latest
    hostname: newsletter
    env_file: .env
    environment:
      TS_HOSTNAME: newsletter
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
      TZ: America/New_York
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

volumes:
  data:
  ts-state:
